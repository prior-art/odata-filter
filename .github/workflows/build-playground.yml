name: Build Playground App

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_extension: AppImage
          - os: macos-latest
            asset_extension: dmg
          - os: windows-latest
            asset_extension: exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@prior-art'
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install NPM Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: just build

      - name: Build Playground App
        run: just build-playground

      - name: Upload Playground App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: odata-filter-playground-${{ matrix.os }}
          path: packages/playground/out/*.${{ matrix.asset_extension }}
          archive: false
